# Reference stack for Coolify or manual Docker deploy on the VPS.
# Coolify can instead build from backend/Dockerfile and attach a managed PostgreSQL service.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: guild_points
      POSTGRES_USER: guild
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U guild -d guild_points']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      SPRING_PROFILES_ACTIVE: prod,discord
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/guild_points
      SPRING_DATASOURCE_USERNAME: guild
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
      UPLOAD_PATH: /data/uploads
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_MEMBER_ROLES: ${DISCORD_MEMBER_ROLES:-Leader,Cerberus}
      OAUTH_FRONTEND_URL: ${OAUTH_FRONTEND_URL:-https://blacklist.guildsystem.com.br}
    volumes:
      - uploads_data:/data/uploads

volumes:
  postgres_data:
  uploads_data:
