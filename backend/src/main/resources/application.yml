spring:
  application:
    name: guild-points
  config:
    # Local secrets (gitignored), e.g. DISCORD_BOT_TOKEN=... — real env vars still win.
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/guild_points}
    username: ${SPRING_DATASOURCE_USERNAME:guild}
    password: ${SPRING_DATASOURCE_PASSWORD:guild}
    hikari:
      # Default is 10: a burst of bids waiting on an auction's row lock would hold all of them.
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  port: 8080
  compression:
    # JSON only: SockJS streaming frames (application/javascript) must not be buffered by gzip.
    enabled: true
    mime-types: application/json
    min-response-size: 1KB

guild:
  metrics:
    # Static bearer token for /actuator/prometheus (Grafana Alloy). Empty = endpoint closed.
    scrape-token: ${METRICS_SCRAPE_TOKEN:}
  schedule:
    test-alert:
      enabled: ${SCHEDULE_TEST_ALERT:true}
      lead-seconds: ${SCHEDULE_TEST_ALERT_LEAD:12}
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-at-least-256-bits-secret-key-here}
    expiration-ms: 86400000
  oauth:
    frontend-url: ${OAUTH_FRONTEND_URL:http://localhost:5173}
  upload:
    base-path: ${UPLOAD_PATH:./uploads}
    max-avatar-size: 2097152
    max-item-size: 2097152
    max-chat-size: 1048576
  discord:
    bot:
      # Empty token disables the Discord member list.
      token: ${DISCORD_BOT_TOKEN:}
      # Empty = first server the bot is in.
      guild-id: ${DISCORD_GUILD_ID:}
      # Role names shown in the list, in display order.
      roles: ${DISCORD_MEMBER_ROLES:Leader,Cerberus}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173}

management:
  endpoints:
    web:
      exposure:
        # /actuator/metrics is restricted to Administrador/Líder and /actuator/prometheus to the
        # collector's scrape token (guild.metrics.scrape-token) in SecurityConfig.
        include: health,info,metrics,prometheus
  metrics:
    tags:
      # Grafana's Spring Boot / JVM dashboards filter by this label.
      application: ${spring.application.name}
    distribution:
      # Latency percentiles show up in /actuator/metrics as <name>.percentile (tag phi).
      percentiles:
        http.server.requests: 0.5,0.95,0.99
        guild.auction.bid: 0.5,0.95,0.99
        guild.party.board.broadcast: 0.5,0.95,0.99
        guild.client.rtt: 0.5,0.95,0.99
      # Fixed buckets so Grafana can compute p95 over any range (histogram_quantile) and the share of
      # bids under 100ms; a handful of series, unlike a full histogram.
      slo:
        guild.auction.bid: 10ms,25ms,50ms,100ms,250ms,500ms,1s
        guild.party.board.broadcast: 10ms,25ms,50ms,100ms,250ms,500ms,1s
        # Members' real ping (browser → server → browser over the socket).
        guild.client.rtt: 25ms,50ms,100ms,200ms,500ms,1s
